[package]
name = "kiri"
version = "0.1.0-beta.4"
edition = "2024"
license = "MIT"

[dependencies]
block2 = "0.6"
futures = "0.3.34"
global-hotkey = "0.9.0"
gpui-kit = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "gif"] }
libc = "0.2.191"
lyon_tessellation = "1"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
objc2-core-text = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-vision = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "objc2-core-graphics", "VNDetectBarcodesRequest", "VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler"] }
png = "0.18"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.12.0"
tray-icon = "0.26.1"

# The spike is only ever built in release: one target tree, no debug info, smaller on disk.
[profile.release]
debug = false
strip = false
