[package]
name = "kiri"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
futures = "0.3.34"
global-hotkey = "0.9.0"
gpui-kit = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "gif"] }
lyon_tessellation = "1"
png = "0.18"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.12.0"
tray-icon = "0.26.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
libc = "0.2.191"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
objc2-core-text = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-vision = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "objc2-core-graphics", "VNDetectBarcodesRequest", "VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler"] }

[target.'cfg(windows)'.dependencies]
# Already in gpui's tree; Windows' strftime aborts on a bad field, chrono reports it.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
windows = { version = "0.62", features = [
    "Foundation_Collections",
    "Globalization",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# The spike is only ever built in release: one target tree, no debug info, smaller on disk.
[profile.release]
debug = false
strip = false
